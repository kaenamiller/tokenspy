[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenspyd"
version = "0.1.0"
description = "AI subscription usage poller for KDE Plasma 6"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "secretstorage>=3.3.3",
]

[project.scripts]
tokenspyd = "tokenspyd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["daemon/tokenspyd"]

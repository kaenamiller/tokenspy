<?xml version="1.0" encoding="UTF-8"?>
<!-- Simplified OpenAI/Codex blossom: three stadium loops at 60-degree offsets,
     which is what the hexagonal knot reduces to at icon size. Monochrome;
     recoloured at runtime via Kirigami.Icon isMask. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <g fill="none" stroke="#000" stroke-width="1.5">
    <rect x="3" y="7.5" width="18" height="9" rx="4.5"/>
    <rect x="3" y="7.5" width="18" height="9" rx="4.5" transform="rotate(60 12 12)"/>
    <rect x="3" y="7.5" width="18" height="9" rx="4.5" transform="rotate(120 12 12)"/>
  </g>
</svg>
